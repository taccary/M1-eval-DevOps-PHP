name: CI - Validation PHP - Correction

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Job 1 : Syntaxe PHP ──
  php-lint:
    name: Vérification syntaxique PHP
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # À adapter selon la version utilisée en cours

      - name: Analyse syntaxique (Lint)
        # Cette commande cherche tous les fichiers .php et vérifie leur syntaxe
        run: find . -name "*.php" -exec php -l {} \;

  # ── Job 2 : Tests d'intégration HTTP ──
  integration-tests:
    name: Tests d'intégration HTTP
    runs-on: ubuntu-latest
    needs: php-lint # ne démarre que si le lint est vert
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Démarrer le serveur PHP et attendre qu'il soit prêt
        run: |
          php -S localhost:8080 -t site &
          for i in {1..10}; do
            if curl -s http://localhost:8080/index.php > /dev/null; then
              echo "Serveur PHP prêt"
              break
            fi
            echo "Attente du serveur PHP..."
            sleep 1
          done

      - name: "Test – Page d'accueil répond 200 et contient le bon titre"
        id: test_accueil
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/index.php")
          if [ "$code" != "200" ]; then
            echo "::error::Accueil : HTTP $code reçu, 200 attendu"
          fi
          body=$(curl -sf "http://localhost:8080/index.php")
          if ! echo "$body" | grep -q "<title>Compagnie Océane - Accueil</title>"; then
            echo "::error::Accueil : balise <title> absente ou incorrecte"
          fi

      - name: "Test – Page qui n'existe pas répond 404"
        id: test_404
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/nonexistent.php")
          if [ "$code" != "404" ]; then
            echo "::error::HTTP $code reçu, 404 attendu pour une page inexistante"
          fi

      - name: "Test – Route inconnue renvoie la page d'erreur personnalisée"
        id: test_route_inconnue
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/index.php?action=unknown")
          if [ "$code" != "200" ]; then
            echo "::error::HTTP $code reçu, 200 attendu pour une route inconnue"
          fi

      - name: "Test - Page d'affichage des bateaux répond 200 et contient bien un tableau avec une colonne 'Nom du bateau'"
        id: test_bateaux
        continue-on-error: true
        run: |
          result="PASS"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/index.php?action=afficheBateau")
          if [ "$code" != "200" ]; then
            echo "::error::Bateaux : HTTP $code reçu, 200 attendu pour la page des bateaux"
            result="FAIL"
          fi
          body=$(curl -s "http://localhost:8080/index.php?action=afficheBateau")
          if ! echo "$body" | grep -q "Nom du navire"; then
            echo "::error::Bateaux : colonne 'Nom du navire' absente du tableau"
            result="FAIL"
          fi
          echo "result=$result" >> $GITHUB_OUTPUT
