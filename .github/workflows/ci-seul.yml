name: CI - Validation PHP Retrogaming

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-lint:
    name: Vérification syntaxique PHP
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # À adapter selon la version utilisée en cours

      - name: Analyse syntaxique (Lint)
        # Cette commande cherche tous les fichiers .php et vérifie leur syntaxe [1, 2]
        run: find . -name "*.php" -exec php -l {} \;

      - name: Démarrer le serveur PHP et attendre qu'il soit prêt
        run: |
          php -S localhost:8080 -t site &
          for i in {1..10}; do
            if curl -s http://localhost:8080/index.php > /dev/null; then
              echo "Serveur PHP prêt"
              break
            fi
            echo "Attente du serveur PHP..."
            sleep 1
          done

      - name: "Test – Accueil répond 200 et contient le bon titre"
        id: test_accueil
        continue-on-error: true
        run: |
          result="PASS"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/index.php")
          if [ "$code" != "200" ]; then
            echo "::error::Accueil : HTTP $code reçu, 200 attendu"
            result="FAIL"
          fi
          body=$(curl -sf "http://localhost:8080/index.php")
          if ! echo "$body" | grep -q "<title>Accueil</title>"; then
            echo "::error::Accueil : balise <title>Accueil</title> absente de la réponse"
            result="FAIL"
          fi
          echo "result=$result" >> $GITHUB_OUTPUT
          [ "$result" = "PASS" ]

      - name: "Test – Page qui n'existe pas répond 404"
        id: test_404
        continue-on-error: true
        run: |
          result="PASS"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/nonexistent.php")
          if [ "$code" != "404" ]; then
            echo "::error::404 : HTTP $code reçu, 404 attendu pour une page inexistante"
            result="FAIL"
          fi
          echo "result=$result" >> $GITHUB_OUTPUT
          [ "$result" = "PASS" ]

      - name: "Test – Route inconnue renvoie la page d'erreur personnalisée"
        id: test_route_inconnue
        continue-on-error: true
        run: |
          result="PASS"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/index.php?action=unknown")
          if [ "$code" != "404" ]; then
            echo "::error::404 : HTTP $code reçu, 404 attendu pour une route inconnue"
            result="FAIL"
          fi
          echo "result=$result" >> $GITHUB_OUTPUT
          [ "$result" = "PASS" ]

      - name: "Résumé des tests"
        if: always()
        run: |
          r1="${{ steps.test_accueil.outputs.result }}"
          r2="${{ steps.test_404.outputs.result }}"
          r3="${{ steps.test_route_inconnue.outputs.result }}"
          [ "$r1" = "PASS" ] && s1="✅ PASS" || s1="❌ FAIL"
          [ "$r2" = "PASS" ] && s2="✅ PASS" || s2="❌ FAIL"
          [ "$r3" = "PASS" ] && s3="✅ PASS" || s3="❌ FAIL"
          {
            echo "## Résultats des tests d'intégration"
            echo ""
            echo "| Test | Résultat |"
            echo "|------|:--------:|"
            echo "| Accueil répond 200 + titre correct | $s1 |"
            echo "| Page inexistante répond 404 | $s2 |"
            echo "| Route inconnue → page d'erreur personnalisée | $s3 |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Faire échouer le job si au moins un test a échoué
          [ "$r1" = "PASS" ] && [ "$r2" = "PASS" ] && [ "$r3" = "PASS" ]
