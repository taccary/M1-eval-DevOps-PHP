name: Deploy PHP Site to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg1-retrogaming_votreNom
  LOCATION: swedencentral
  PROJECT_NAME: retrogamein

jobs:
  # -- Job 1 : Deploiement de l'infrastructure via Bicep ---------------------
  deploy-infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    outputs:
      webAppName: ${{ steps.bicep.outputs.webAppName }}
      webAppUrl: ${{ steps.bicep.outputs.webAppUrl }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deployer l'infrastructure Bicep
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            projectName=${{ env.PROJECT_NAME }}
            location=${{ env.LOCATION }}
          failOnStdErr: false

  # -- Job 2 : Generation SQLite + packaging + deploiement ------------------
  deploy-app:
    name: Site PHP + base SQLite (ZIP deploy)
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - uses: actions/checkout@v4

      - name: Generer la base SQLite depuis le dump MySQL
        run: |
          python3 database/scripts/mysql2sqlite.py \
            database/sources-sql/oceane.sql > /tmp/oceane-sqlite.sql
          sqlite3 database/oceane.db < /tmp/oceane-sqlite.sql
          echo "Base SQLite creee : $(du -sh database/oceane.db)"

      - name: Creer l'archive ZIP (site/ + database/oceane.db)
        run: zip -r app.zip site/ database/oceane.db

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deployer sur Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra.outputs.webAppName }}
          package: app.zip

      - name: URL du site deploye
        run: echo "Site disponible sur ${{ needs.deploy-infra.outputs.webAppUrl }}"
